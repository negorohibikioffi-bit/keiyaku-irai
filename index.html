<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>契約作成依頼</title>
    <!-- ホーム画面に置いたときアプリとして開くための一式（相対パスでGitHub Pagesに対応） -->
    <link rel="manifest" href="manifest.webmanifest">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
    <meta name="theme-color" content="#0a0e1a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="契約作成依頼">
    <style>
:root{--bg:#0a0e1a;--surface:rgba(255,255,255,.045);--border:rgba(255,255,255,.10);--text:#e8ecf8;--dim:#8791b0;--label:#a4adc8;--input:rgba(255,255,255,.05);--gold:#f0c869;--blue:#7aa2ff;--red:#ff6b70;--green:#10b981;color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic UI','Segoe UI',sans-serif;color:var(--text);min-height:100vh;padding:20px 16px 110px;
background:radial-gradient(900px 500px at 10% -10%,rgba(99,102,241,.22),transparent 60%),radial-gradient(800px 500px at 100% 0%,rgba(240,200,105,.10),transparent 60%),var(--bg);background-attachment:fixed}
.container{max-width:700px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.4);overflow:hidden}
.header{position:relative;padding:26px 96px 22px;text-align:center;background:linear-gradient(135deg,rgba(240,200,105,.14),rgba(99,102,241,.10));border-bottom:1px solid var(--border)}
.header h1{font-size:24px;font-weight:900;letter-spacing:.08em;margin-bottom:6px;background:linear-gradient(90deg,#fff,#f0c869);-webkit-background-clip:text;background-clip:text;color:transparent}
.header p{font-size:13px;color:var(--dim)}
.header-logo{position:absolute;right:16px;top:50%;transform:translateY(-50%);height:56px;width:auto;filter:drop-shadow(0 0 8px rgba(240,200,105,.25))}
.form-section{padding:26px}
.form-group{margin-bottom:20px}
label{display:block;font-weight:700;margin-bottom:8px;color:var(--label);font-size:13px;letter-spacing:.03em}
select,input,textarea{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:15px;font-family:inherit;color:var(--text);background:var(--input);transition:all .2s}
select option{background:#141a30;color:var(--text)}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.25)}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--gold);background:rgba(240,200,105,.06);box-shadow:0 0 0 3px rgba(240,200,105,.15)}
#sendTo{background:rgba(255,255,255,.03)!important;color:var(--dim)}
#remarks{border:1px solid var(--border)!important;background:var(--input)!important;color:var(--text)!important}
.required{color:var(--red)}
.action-bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom));background:rgba(10,14,26,.85);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--border);box-shadow:0 -4px 24px rgba(0,0,0,.4);z-index:500}
.action-bar-inner{max-width:700px;margin:0 auto}
.action-bar-inner{display:flex;gap:10px}.action-bar .btn-slack{flex:1;padding:16px 10px;font-size:16px;letter-spacing:.05em}.action-bar .btn-slack.sub{flex:0 0 36%;background:rgba(255,255,255,.08);color:var(--text);box-shadow:none;border:1px solid var(--border);font-size:13px}.action-bar .btn-slack:disabled{opacity:.6}
.label-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.label-row label{margin-bottom:0}
.btn-gear{background:none;border:none;color:var(--blue);font-size:12px;font-weight:700;padding:4px 6px;cursor:pointer;flex-shrink:0}
.btn-gear:hover{text-decoration:underline}
.error-msg{display:none;color:var(--red);font-size:12px;font-weight:700;margin-top:6px}
.field-error .error-msg{display:block}
.field-error select,.field-error input,.field-error textarea{border-color:var(--red)!important;background:rgba(255,107,112,.10)!important}
.preview-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}
.preview-head h3{color:var(--gold)!important;font-size:15px}
button{padding:14px 24px;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit}
button:active{transform:scale(.98)}
.btn-slack{background:linear-gradient(135deg,#611f69,#9b4dca);color:#fff;box-shadow:0 6px 20px rgba(155,77,202,.35)}
.btn-slack:hover{box-shadow:0 8px 26px rgba(155,77,202,.55);transform:translateY(-1px)}
.preview-section{background:rgba(0,0,0,.18);padding:26px;border-top:1px solid var(--border);display:none}
.preview-section.active{display:block}
.preview-box{background:rgba(255,255,255,.04);padding:22px;border-radius:12px;border:1px solid rgba(240,200,105,.28);white-space:pre-wrap;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo UI",sans-serif;font-size:14px;line-height:1.8;max-height:500px;overflow-y:auto;font-weight:600;color:var(--text)}
.toast{position:fixed;top:20px;right:20px;background:var(--green);color:#fff;padding:16px 24px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:none;animation:slideIn .3s ease;z-index:1000}
.toast.active{display:block}
@keyframes slideIn{from{transform:translateX(400px);opacity:0}to{transform:translateX(0);opacity:1}}
.info-text{font-size:12px;color:var(--dim);margin-top:4px}
.btn-mini{background:linear-gradient(135deg,#3b6cf5,#6366f1);color:#fff;padding:8px 14px;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:13px}
.btn-mini.secondary{background:rgba(255,255,255,.10);color:var(--text)}
.save-row{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--label)}
.save-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold);flex-shrink:0}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;z-index:1000}
.modal-backdrop.active{display:flex}
.modal{background:#121830;border:1px solid var(--border);border-radius:16px;width:100%;max-width:440px;max-height:80vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal-head{padding:16px;border-bottom:1px solid var(--border);font-weight:700;color:var(--gold)}
.modal-body{padding:16px;overflow-y:auto}
.modal-foot{padding:12px 16px;border-top:1px solid var(--border);text-align:right}
.modal-add{display:flex;gap:8px;margin-bottom:14px}
.modal-add input{flex:1;min-width:0;padding:10px 12px}
.list-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border);font-size:14px;color:var(--text)}
.add-row-group{margin-top:-12px}
.btn-add-row{padding:6px 14px;margin-top:8px;background:rgba(122,162,255,.12);border:1px solid rgba(122,162,255,.35);color:var(--blue);border-radius:999px;font-size:12px;font-weight:700}
.btn-add-row:hover{background:rgba(122,162,255,.22)}
.btn-row-del{background:none;border:none;color:var(--red);font-size:12px;font-weight:700;padding:4px 6px;cursor:pointer;flex-shrink:0}
.sub-input{margin-top:8px}
.btn-del{background:rgba(255,107,112,.18);color:var(--red);border:1px solid rgba(255,107,112,.4);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12px;font-weight:700;flex-shrink:0}
@media(max-width:480px){.header{padding:22px 76px 18px}.header h1{font-size:20px}.header-logo{height:44px;right:12px}.form-section{padding:20px 16px}}

.inline-row{display:flex;gap:8px}.inline-row>*{flex:1;min-width:0}
.unit-input{display:flex;align-items:center;gap:8px}.unit-input input{flex:1;min-width:0;text-align:right}.unit-input .unit{font-weight:700;color:var(--label);flex-shrink:0}
#channelView{background:rgba(255,255,255,.03)!important;color:var(--dim)!important}
#slackLink{background:rgba(255,255,255,.1)!important;color:var(--text)!important;border-radius:8px;padding:8px 14px;font-weight:700;font-size:13px;display:inline-block}
.btn-mini{text-decoration:none}
</style>
</head>

            <h1>契約作成依頼</h1>
            <p>赤い項目は必ず入力してください</p>
        </div>

        <div class="form-section">
            <div class="form-group">
                <div class="label-row">
                    <label class="required">投稿先チャンネル</label>
                    <button type="button" class="btn-gear" id="btnChannel">⚙ 変更</button>
                </div>
                <input type="text" id="channelView" readonly style="background: #f0f0f0;">
                <div class="info-text" id="threadStatus"></div>
            </div>

            <div class="form-group">
                <label class="required" for="customerName">お客様名</label>
                <input type="text" id="customerName" placeholder="例：田中　太郎">
                <div class="info-text">「様」は自動で追加されます</div>
            </div>

            <div class="form-group">
                <label class="required" for="customerKana">名前（フリガナ）</label>
                <input type="text" id="customerKana" placeholder="例：タナカ　タロウ">
                <div class="info-text">「サマ」は自動で追加されます</div>
            </div>

            <div class="form-group">
                <label class="required" for="address">住所</label>
                <input type="text" id="address" placeholder="例：神奈川県横浜市鶴見区北寺尾6-19-10 ○○104号室">
            </div>

            <div class="form-group">
                <label class="required" for="email">お客様メールアドレス</label>
                <input type="email" id="email" inputmode="email" autocapitalize="off" placeholder="例：example@gmail.com">
            </div>

            <div class="form-group">
                <div class="label-row">
                    <label class="required" for="propertyName">物件名</label>
                    <button type="button" class="btn-gear" data-edit-list="property">⚙ 物件リスト</button>
                </div>
                <select id="propertyName">
                    <option value="">選択してください</option>
                </select>
            </div>

            <div class="form-group" id="customPropertyGroup" style="display: none;">
                <label class="required">物件名（手入力）</label>
                <input type="text" id="customProperty" placeholder="物件名を入力してください">
                <div class="save-row">
                    <input type="checkbox" id="savePropertyToList">
                    <label for="savePropertyToList" style="margin: 0; font-weight: 500;">この物件名をリストに追加する</label>
                </div>
            </div>

            <div class="form-group">
                <label class="required" for="roomNumber">号室</label>
                <input type="text" id="roomNumber" placeholder="例：504号室">
            </div>

            <div class="form-group">
                <div class="label-row">
                    <label class="required" for="bank">金融機関</label>
                    <button type="button" class="btn-gear" data-edit-list="bank">⚙ 銀行リスト</button>
                </div>
                <select id="bank">
                    <option value="">選択してください</option>
                </select>
            </div>

            <div class="form-group" id="customBankGroup" style="display: none;">
                <label class="required">金融機関（手入力）</label>
                <input type="text" id="customBank" placeholder="金融機関名を入力してください">
                <div class="save-row">
                    <input type="checkbox" id="saveBankToList">
                    <label for="saveBankToList" style="margin: 0; font-weight: 500;">この金融機関をリストに追加する</label>
                </div>
            </div>

            <div class="form-group">
                <label class="required" for="rate">金利</label>
                <input type="text" id="rate" inputmode="decimal" placeholder="例：2.376">
                <div class="info-text">「%」は自動で追加されます</div>
            </div>

            <div class="form-group">
                <label class="required" for="years">借入年数</label>
                <select id="years"></select>
            </div>

            <div class="form-group">
                <label class="required" for="price">売買代金</label>
                <div class="unit-input">
                    <input type="text" id="price" class="js-money" inputmode="numeric" placeholder="3,500">
                    <span class="unit">万円</span>
                </div>
            </div>

            <div class="form-group">
                <label class="required" for="deposit">手付金</label>
                <select id="deposit">
                    <option value="無し">無し</option>
                    <option value="有り">有り</option>
                </select>
                <div class="unit-input sub-input" id="depositAmountRow" style="display: none;">
                    <input type="text" id="depositAmount" class="js-money" inputmode="numeric" placeholder="10">
                    <span class="unit">万円</span>
                </div>
            </div>

            <div class="form-group">
                <div class="label-row">
                    <label class="required" for="expenseLoan">諸費用ローン</label>
                    <a class="btn-gear" id="expenseCalcLink" href="https://negorohibikioffi-bit.github.io/desktop-tutorial/shohiyo-calc.html" target="_blank" rel="noopener" style="text-decoration: none;">🧮 諸費用計算アプリ</a>
                </div>
                <select id="expenseLoan">
                    <option value="無">無</option>
                    <option value="有">有</option>
                </select>
            </div>

            <div class="form-group" id="expenseLoanAmountGroup" style="display: none;">
                <label class="required" for="expenseLoanAmount">諸費用ローン額</label>
                <div class="unit-input">
                    <input type="text" id="expenseLoanAmount" class="js-money" inputmode="numeric" placeholder="85">
                    <span class="unit">万円</span>
                </div>
                <!-- 諸費用は決済月で変わるので、諸費用計算アプリで指定した月を残す（例：2026-11） -->
                <input type="hidden" id="expenseMonth">
                <div class="info-text" id="expenseMonthText" style="display: none;"></div>
            </div>

            <div class="form-group">
                <label for="loanAmount">ローン金額</label>
                <input type="text" id="loanAmount" readonly placeholder="売買代金を入れると自動で計算" style="background: #f0f0f0;">
                <div class="info-text">売買代金 − 手付金 ＋ 諸費用ローン額 で自動計算</div>
            </div>

            <div class="form-group">
                <label class="required" for="rent">保証賃料</label>
                <div class="unit-input">
                    <input type="text" id="rent" class="js-money" inputmode="numeric" placeholder="84,400">
                    <span class="unit">円</span>
                </div>
            </div>

            <div class="form-group">
                <label class="required" for="contractDate">契約日・時間</label>
                <div class="inline-row">
                    <select id="contractDate"></select>
                    <select id="contractTime"></select>
                </div>
            </div>

            <div class="form-group">
                <label for="gmoDate">GMO送信時間</label>
                <div class="inline-row">
                    <select id="gmoDate"></select>
                    <select id="gmoTime"></select>
                </div>
            </div>

            <div class="form-group">
                <label class="required" for="place">契約場所</label>
                <select id="place">
                    <option value="">選択してください</option>
                    <option value="ファミレス・喫茶店">ファミレス・喫茶店</option>
                    <option value="自宅">自宅</option>
                    <option value="勤務先">勤務先</option>
                    <option value="来社">来社</option>
                </select>
            </div>

            <div class="form-group">
                <div class="label-row">
                    <label class="required" for="personInCharge">担当</label>
                    <button type="button" class="btn-gear" data-edit-list="staff">⚙ 社員リスト</button>
                </div>
                <select id="personInCharge">
                    <option value="">選択してください</option>
                </select>
            </div>

            <div class="form-group">
                <label for="accompany">同行</label>
                <select id="accompany" class="js-accompany-select">
                    <option value="">選択してください</option>
                </select>
            </div>

            <div id="extraAccompany"></div>

            <div class="form-group add-row-group">
                <button type="button" class="btn-add-row" id="btnAddAccompany">＋ 同行者</button>
            </div>

            <div class="form-group">
                <label class="required" for="takken">立会宅建士</label>
                <select id="takken">
                    <option value="有">有</option>
                    <option value="無">無</option>
                </select>
            </div>

            <div class="form-group">
                <label for="remarks">備考</label>
                <textarea id="remarks" rows="3" placeholder="例：駐車場あり、書類持参など" style="resize: vertical;"></textarea>
            </div>
        </div>

        <div class="modal">

                <div class="form-group">
                    <label for="setChannel">チャンネルID（C○○）</label>
                    <input type="text" id="setChannel" autocapitalize="characters" placeholder="例：C08P1PGLHT5">
                    <div class="info-text">#案件進捗：C08P1PGLHT5 ／ 営業：C08P1MWKVT5 ／ 全体：C08N4SFRQF8</div>
                </div>
                <div class="form-group">
                    <label for="setTeam">Team ID（T○○）</label>
                    <input type="text" id="setTeam" autocapitalize="characters" placeholder="例：T08N4SFEAQN">

                    <input type="url" id="setGasUrl" autocapitalize="off" placeholder="https://script.google.com/macros/s/…/exec">

    <!-- 諸費用計算アプリをこの画面の上に重ねて開く（iPhoneのホーム画面アプリでも結果を受け取れるように） -->
    <div id="calcOverlay" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 3500; background: #f2f3f7; flex-direction: column;">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; padding-top: calc(10px + env(safe-area-inset-top, 0px)); background: #0B2A5B; color: #fff;">
            <span style="font-weight: 700;">🧮 諸費用計算</span>
            <button type="button" id="calcOverlayDone" class="btn-mini" style="background: #fff; color: #0B2A5B;">反映して戻る</button>
        </div>
        <iframe id="calcFrame" title="諸費用計算アプリ" style="flex: 1; width: 100%; border: 0; background: #f2f3f7;"></iframe>
    </div>

    <div class="toast" id="toast">コピーしました！</div>

    <script>
        // ========== 投稿先（Slack） ==========
        const SK = 'axia_keiyaku_irai_v2';
        // gasUrl：Slack投稿用GAS（gas/Slack投稿用GAS.gs）のウェブアプリURL（設定画面で入れる）
        const DEFAULTS = { channel: 'C08P1PGLHT5', team: 'T08N4SFEAQN', threadApi: '', gasUrl: 'https://script.google.com/macros/s/AKfycbzQ_wAO5KUfO9r1PYTN-qCa-ENgwY6qxuMMSifeP9SIiqzD3Ms3uhm123No31MWU7hqDA/exec' };

        function loadSettings() {
            try {
                return Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem(SK) || '{}'));
            } catch (e) {
                return Object.assign({}, DEFAULTS);
            }
        }

        function saveSettings(s) {
            try {
                localStorage.setItem(SK, JSON.stringify(s));
            } catch (e) {
                console.error('設定の保存エラー:', e);
            }
        }

        let settings = loadSettings();
        // 旧バージョンで未保存の値は最新の既定値で補う
        if (!settings.team) { settings.team = DEFAULTS.team; saveSettings(settings); }
        if (!settings.channel) { settings.channel = DEFAULTS.channel; saveSettings(settings); }
        // 端末に空の設定が残っていても、最初から入れてある投稿用URLを使う
        if (!settings.gasUrl && DEFAULTS.gasUrl) { settings.gasUrl = DEFAULTS.gasUrl; saveSettings(settings); }
        if (!settings.threadApi && DEFAULTS.threadApi) { settings.threadApi = DEFAULTS.threadApi; saveSettings(settings); }

        const CHANNEL_NAMES = { 'C08P1PGLHT5': '#案件進捗', 'C08P1MWKVT5': '営業チャンネル', 'C08N4SFRQF8': '全体チャンネル' };

        // 投稿先チャンネルのWeb版URL（ボタンが効かないときに押すリンク用）
        function slackWebUrl() {
            return 'https://app.slack.com/client/' + encodeURIComponent(settings.team) + '/' + encodeURIComponent(settings.channel);
        }

        function isIOSDevice() {
            const ua = navigator.userAgent;
            if (/iPhone|iPad|iPod/i.test(ua)) return true;
            return /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
        }

        function isAndroidDevice() {
            return /Android/i.test(navigator.userAgent);
        }

        // Slackアプリでチャンネルを開くURL（team と id の両方が無いとホーム画面で止まる）
        // Androidは slack:// だと開かない端末があるので intent:// でSlackアプリを直接指定する
        function slackAppUrl() {
            const query = 'team=' + encodeURIComponent(settings.team) + '&id=' + encodeURIComponent(settings.channel);
            if (isAndroidDevice()) {
                return 'intent://channel?' + query +
                    '#Intent;scheme=slack;package=com.Slack;S.browser_fallback_url=' +
                    encodeURIComponent(slackWebUrl()) + ';end';
            }
            return 'slack://channel?' + query;
        }

        // ========== 申込投稿のスレッド ==========
        // 選んだ物件（＋号室・お客様名）の申込投稿をGASに聞いておき、見つかればそのスレッドを開く
        let currentThread = null;   // { ts, url }
        let threadSeq = 0;
        let threadTimer = null;
        let threadSearching = false;

        function selectedPropertyName() {
            const v = document.getElementById('propertyName').value;
            return v === 'その他' ? document.getElementById('customProperty').value.trim() : v;
        }

        function setThreadStatus(text) {
            document.getElementById('threadStatus').textContent = text;
        }

        // GASは寝起きだと返事に30秒以上かかることがあるので、待ち時間は長めにとる
        const THREAD_TIMEOUT_MS = 45000;

        // ページを開いたらGASを起こしておく（入力し終わるころには早く返ってくる）
        function wakeThreadApi() {
            if (!settings.gasUrl) return;
            try { fetch(settings.gasUrl, { mode: 'no-cors' }).catch(function() {}); } catch (e) {}
        }

        function lookupThread(retried) {
            currentThread = null;
            renderChannelView();
            const property = selectedPropertyName();
            if (!settings.gasUrl || !property) {
                setThreadStatus('');
                return;
            }
            const seq = ++threadSeq;
            threadSearching = true;
            setThreadStatus('申込スレッドを探しています…');
            const ctrl = new AbortController();
            const timer = setTimeout(function() { ctrl.abort(); }, THREAD_TIMEOUT_MS);
            fetch(settings.gasUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    action: 'findThread',
                    channel: settings.channel,
                    property: property,
                    room: document.getElementById('roomNumber').value.trim(),
                    customer: document.getElementById('customerName').value.trim()
                }),
                signal: ctrl.signal
            }).then(function(r) { return r.json(); }).then(function(data) {
                clearTimeout(timer);
                if (seq !== threadSeq) return;   // 入力が変わった後の古い返事は捨てる
                finish(data && data.ok ? data : null);
            }).catch(function() {
                clearTimeout(timer);
                if (seq !== threadSeq) return;
                // 届かなかったときは1回だけ聞き直す
                if (!retried) { lookupThread(true); return; }
                finish(null);
            });

            function finish(data) {
                threadSearching = false;
                currentThread = data && data.ts ? data : null;
                renderChannelView();
                setThreadStatus(currentThread
                    ? '📌 ' + property + ' の申込スレッドに返信します'
                    : (data ? '申込投稿が見つかりません（チャンネルに新しく投稿します）' : 'スレッドを探せませんでした（チャンネルに新しく投稿します）'));
            }
        }

        function scheduleLookupThread() {
            clearTimeout(threadTimer);
            threadTimer = setTimeout(lookupThread, 500);
        }

        // スレッドを開くURL（Androidは intent:// でSlackアプリを指定）
        // Androidのアプリは https のスレッドURLを受け取れない（Web版かPlayストアになる）。
        // スレッドを直接開く書き方も無いので、slack://channel に ts= を付けて申込投稿の位置まで飛ばす
        // （実機で確認済み。message= や thread_ts= ではチャンネルの先頭で止まる）
        function threadAppUrl() {
            if (!isAndroidDevice()) return currentThread.url;
            const query = 'team=' + encodeURIComponent(settings.team) + '&id=' + encodeURIComponent(settings.channel) +
                '&ts=' + encodeURIComponent(currentThread.ts);
            return 'intent://channel?' + query +
                '#Intent;scheme=slack;package=com.Slack;S.browser_fallback_url=' +
                encodeURIComponent(currentThread.url) + ';end';
        }

        function isEmbedded() {
            try { return window.top !== window.self; } catch (e) { return true; }
        }

        function renderChannelView() {
            // スマホではリンクからもSlackアプリを開く（埋め込み表示のときはWeb版）
            const mobile = isAndroidDevice() || isIOSDevice();
            const link = document.getElementById('slackLink');
            if (currentThread) {
                link.href = mobile && !isEmbedded() ? threadAppUrl() : currentThread.url;
            } else {
                link.href = mobile && !isEmbedded() ? slackAppUrl() : slackWebUrl();
            }
            if (link.href.indexOf('https:') !== 0) link.removeAttribute('target');
            else link.setAttribute('target', '_blank');
            const name = CHANNEL_NAMES[settings.channel];
            document.getElementById('channelView').value = name ? name + '（' + settings.channel + '）' : settings.channel;
        }

        // ========== マスターリスト（Gmail builderと共通の保存先） ==========
        const DEFAULT_PROPERTIES = [
            'AXIA M-City大阪加賀屋',
            'AXIA CITY神戸松原',
            'AXIA CITY武蔵小山',
            'AXIA CITY大阪瑞光',
            'AXIA M-CITY浮間公園',
            'AXIA CITY 下井草全',
            'AXIA CITY 亀有'
        ];

        // 名称が変わった物件（保存済みのリストも読み替える）
        const PROPERTY_RENAMES = {
            'AXIA CITY浮間舟渡': 'AXIA M-CITY浮間公園',
            'AXIA M-CITY浮間舟渡': 'AXIA M-CITY浮間公園'
        };

        const DEFAULT_BANKS = [
            '楽天銀行',
            'SBJ銀行',
            'イオン住宅ローンサービス',
            'SBI新生アセットファイナンス'
        ];

        const DEFAULT_STAFF = [
            '茂木社長', '井上常務', '笠原部長', '土屋次長', '家原部長',
            '伊藤係長', '川合部長', '安部課長', '髙野係長', '佐野係長',
            '浅見主任', '坪井社員', '桃井主任', '五十嵐主任', '三浦社員',
            '儀間主任', '脇田主任', '内田社員', '瓜田社員', '柴田社員',
            '木村社員', '後藤社員', '糸永社員', '堀社員'
        ];

        const LIST_DEFS = {
            property: { key: 'propertyList_v3', label: '物件リスト', placeholder: '物件名を入力', defaults: DEFAULT_PROPERTIES, render: renderPropertySelect },
            bank:     { key: 'bankList_v3',     label: '銀行リスト', placeholder: '銀行名を入力', defaults: DEFAULT_BANKS,      render: renderBankSelect },
            staff:    { key: 'staffList_v2',    label: '社員リスト', placeholder: '社員名を入力', defaults: DEFAULT_STAFF,      render: renderStaffSelects }
        };

        // リスト取得（保存が無ければ初期値）
        function getList(type) {
            const def = LIST_DEFS[type];
            try {
                const saved = localStorage.getItem(def.key);
                if (saved) {
                    let arr = JSON.parse(saved);
                    if (Array.isArray(arr) && arr.length > 0) {
                        if (type === 'property') arr = renameProperties(arr, def.key, saved);
                        return arr;
                    }
                }
            } catch (e) {
                console.error('リスト読み込みエラー:', e);
            }
            return def.defaults.slice();
        }

        // 物件：保存済みリストの旧名称を新名称に読み替えて保存し直す
        function renameProperties(arr, key, saved) {
            const renamed = [];
            arr.forEach(function(name) {
                const fixed = PROPERTY_RENAMES[name] || name;
                if (renamed.indexOf(fixed) === -1) renamed.push(fixed);
            });
            if (JSON.stringify(renamed) !== saved) {
                localStorage.setItem(key, JSON.stringify(renamed));
            }
            return renamed;
        }

        // リスト保存＋ドロップダウン再描画
        function setList(type, arr) {
            const def = LIST_DEFS[type];
            try {
                localStorage.setItem(def.key, JSON.stringify(arr));
            } catch (e) {
                console.error('リスト保存エラー:', e);
            }
            def.render();
        }

        // リストに1件追加（既存なら false）
        function addToList(type, name) {
            const arr = getList(type);
            if (arr.indexOf(name) !== -1) return false;
            arr.push(name);
            setList(type, arr);
            return true;
        }

        // セレクトを組み立て直す（選択中の値はできるだけ維持）
        function fillSelect(selectId, items, options) {
            fillSelectEl(document.getElementById(selectId), items, options);
        }

        function fillSelectEl(select, items, options) {
            if (!select) return;
            const current = select.value;
            const opts = options || {};

            select.innerHTML = '';
            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = '選択してください';
            select.appendChild(placeholder);

            items.forEach(function(name) {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                select.appendChild(option);
            });

            if (opts.custom) {
                const other = document.createElement('option');
                other.value = 'その他';
                other.textContent = '✏️ その他（手入力）';
                select.appendChild(other);
            }

            select.value = current;
            if (select.value !== current) select.value = '';
        }

        function renderPropertySelect() {
            fillSelect('propertyName', getList('property'), { custom: true });
        }

        function renderBankSelect() {
            fillSelect('bank', getList('bank'), { custom: true });
        }

        function renderStaffSelects() {
            const items = getList('staff');
            fillSelect('personInCharge', items, {});
            Array.prototype.forEach.call(document.querySelectorAll('.js-accompany-select'), function(select) {
                fillSelectEl(select, items, {});
            });
        }

        // 借入年数 30〜45年（初期値35年）
        function renderYears() {
            const select = document.getElementById('years');
            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = '選択してください';
            select.appendChild(placeholder);
            for (let i = 45; i >= 30; i--) {
                const option = document.createElement('option');
                option.value = String(i);
                option.textContent = i + '年';
                select.appendChild(option);
            }
            select.value = '35';
        }

        // 契約日・GMO送信日：今日から60日先までを「10/5（日）」の形で並べる
        function renderContractDates(id) {
            const select = document.getElementById(id);
            const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = '日付を選択';
            select.appendChild(placeholder);

            const today = new Date();
            for (let i = 0; i <= 60; i++) {
                const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() + i);
                const option = document.createElement('option');
                // 値は 2026-10-05 の形（依頼文の書式は formatContractDate で整える）
                option.value = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
                option.textContent = (d.getMonth() + 1) + '/' + d.getDate() + '（' + weekdays[d.getDay()] + '）';
                select.appendChild(option);
            }
        }

        // 契約時間・GMO送信時間：9:00〜21:00を30分きざみ（初期値があれば選んでおく）
        function renderContractTimes(id, initial) {
            const select = document.getElementById(id);
            const none = document.createElement('option');
            none.value = '';
            none.textContent = '時間を選択';
            select.appendChild(none);

            for (let m = 9 * 60; m <= 21 * 60; m += 30) {
                const time = Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0');
                const option = document.createElement('option');
                option.value = time;
                option.textContent = time;
                select.appendChild(option);
            }
            select.value = initial || '';
        }

        // ========== 同行者の追加行 ==========
        function addAccompanyRow() {
            const wrap = document.createElement('div');
            wrap.className = 'form-group extra-accompany';

            const labelRow = document.createElement('div');
            labelRow.className = 'label-row';
            const label = document.createElement('label');
            const del = document.createElement('button');
            del.type = 'button';
            del.className = 'btn-row-del';
            del.textContent = '✕ 削除';
            del.addEventListener('click', function() {
                wrap.remove();
                renumberAccompanyRows();
            });
            labelRow.appendChild(label);
            labelRow.appendChild(del);

            const select = document.createElement('select');
            select.className = 'js-accompany-select extra-accompany-select';

            wrap.appendChild(labelRow);
            wrap.appendChild(select);
            document.getElementById('extraAccompany').appendChild(wrap);

            fillSelectEl(select, getList('staff'), {});
            renumberAccompanyRows();
        }

        function renumberAccompanyRows() {
            Array.prototype.forEach.call(document.querySelectorAll('.extra-accompany'), function(row, i) {
                row.querySelector('label').textContent = '同行（' + (i + 2) + '人目）';
            });
        }

        // 同行者を重複なしで集める
        function collectAccompany() {
            const list = [];
            Array.prototype.forEach.call(document.querySelectorAll('.js-accompany-select'), function(select) {
                const name = select.value;
                if (name && list.indexOf(name) === -1) list.push(name);
            });
            return list;
        }

        // ========== リスト編集モーダル ==========
        let currentListType = null;

        function openListModal(type) {
            currentListType = type;
            const def = LIST_DEFS[type];
            document.getElementById('listModalTitle').textContent = def.label + 'の編集';
            const input = document.getElementById('listModalInput');
            input.value = '';
            input.placeholder = def.placeholder;
            renderListModalItems();
            document.getElementById('listModal').classList.add('active');
        }

        function closeListModal() {
            document.getElementById('listModal').classList.remove('active');
            currentListType = null;
        }

        function renderListModalItems() {
            const box = document.getElementById('listModalItems');
            box.innerHTML = '';
            const items = getList(currentListType);

            if (items.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'info-text';
                empty.textContent = '項目がありません';
                box.appendChild(empty);
                return;
            }

            items.forEach(function(name) {
                const row = document.createElement('div');
                row.className = 'list-item';

                const label = document.createElement('span');
                label.textContent = name;

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'btn-del';
                btn.textContent = '削除';
                btn.addEventListener('click', function() {
                    if (!confirm('「' + name + '」をリストから削除しますか？')) return;
                    const arr = getList(currentListType);
                    const index = arr.indexOf(name);
                    if (index !== -1) arr.splice(index, 1);
                    setList(currentListType, arr);
                    renderListModalItems();
                    showToast('「' + name + '」を削除しました', 'success');
                });

                row.appendChild(label);
                row.appendChild(btn);
                box.appendChild(row);
            });
        }

        function addFromListModal() {
            const input = document.getElementById('listModalInput');
            const name = input.value.trim();

            if (!name) {
                alert('追加する内容を入力してください');
                return;
            }
            if (!addToList(currentListType, name)) {
                alert('「' + name + '」はすでにリストにあります');
                return;
            }

            input.value = '';
            renderListModalItems();
            showToast('「' + name + '」を追加しました', 'success');
        }

        // ========== 投稿先チャンネルの設定モーダル ==========
        function openChannelModal() {
            document.getElementById('setChannel').value = settings.channel || '';
            document.getElementById('setTeam').value = settings.team || '';
            document.getElementById('setGasUrl').value = settings.gasUrl || '';
            document.getElementById('channelModal').classList.add('active');
        }

        function closeChannelModal() {
            document.getElementById('channelModal').classList.remove('active');
        }

        function saveChannelModal() {
            const channel = document.getElementById('setChannel').value.trim().toUpperCase();
            const team = document.getElementById('setTeam').value.trim().toUpperCase();
            if (!/^[CG][A-Z0-9]+$/.test(channel)) {
                alert('チャンネルIDは「C」から始まる英数字で入力してください');
                return;
            }
            if (!/^T[A-Z0-9]+$/.test(team)) {
                alert('Team IDは「T」から始まる英数字で入力してください');
                return;
            }
            const gasUrl = document.getElementById('setGasUrl').value.trim();
            if (gasUrl && !/^https:\/\/script\.google(usercontent)?\.com\//.test(gasUrl)) {
                alert('投稿用URLは https://script.google.com/… のURLを入れてください');
                return;
            }
            settings.channel = channel;
            settings.team = team;

        function toggleCustomGroup(selectId, groupId, inputId, checkboxId) {

        // ========== 諸費用計算アプリとの連携 ==========
        // 売買代金を渡して開き、向こうで計算した上乗せ諸費用を
        // localStorage 経由で受け取って「諸費用ローン額」に入れる（同じサイトなので共有できる）
        const SHOHIYO_KEY = 'axia_shohiyo_for_keiyaku';

        function openExpenseCalc() {
            // v は毎回変えて、スマホに残った古い諸費用計算アプリを使わないようにする
            const params = new URLSearchParams({ from: 'keiyaku', v: String(Date.now()) });
            const price = moneyValue('price');
            if (price) params.set('price', String(price));

            // 開いた時刻より後の計算結果だけを受け取る
            try { sessionStorage.setItem('shohiyoOpenedAt', String(Date.now())); } catch (e) {}

            const url = document.getElementById('expenseCalcLink').getAttribute('href').split('?')[0] + '?' + params.toString();
            // 別タブではなくこの画面の上に重ねて開く（iPhoneはホーム画面アプリとSafariで保存場所が別なので、別タブだと結果が戻らない）
            document.getElementById('calcFrame').src = url;
            document.getElementById('calcOverlay').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeExpenseCalc() {
            const overlay = document.getElementById('calcOverlay');
            if (overlay.style.display === 'none') return;
            applyExpenseCalcResult();
            overlay.style.display = 'none';
            document.body.style.overflow = '';
            document.getElementById('calcFrame').src = 'about:blank';
        }

        function applyExpenseCalcResult() {
            let result = null;
            let openedAt = 0;
            try {
                result = JSON.parse(localStorage.getItem(SHOHIYO_KEY) || 'null');
                openedAt = Number(sessionStorage.getItem('shohiyoOpenedAt') || 0);
            } catch (e) {
                return;
            }
            if (!result || !openedAt || result.at < openedAt) return;

            const expenseLoan = document.getElementById('expenseLoan');
            if (expenseLoan.value !== '有') {
                expenseLoan.value = '有';
                document.getElementById('expenseLoanAmountGroup').style.display = 'block';
            }
            setExpenseMonth(result.month || '', result.bank || '');
            // 上乗せ諸費用は万円単位で入れる（楽天は万円未満・SBIは10万未満切り捨て済み）
            const text = formatComma(Math.round(result.amount / 10000));
            const input = document.getElementById('expenseLoanAmount');
            if (input.value === text) return;
            input.value = text;
            updateLoanAmount();
        }

        // 諸費用計算アプリで指定した決済月（2026-11）を残して、画面に「2026年11月決済で計算」と出す
        function setExpenseMonth(month, bank) {
            document.getElementById('expenseMonth').value = month;
            const note = document.getElementById('expenseMonthText');
            const label = formatExpenseMonth(month);
            note.textContent = label ? '🧮 諸費用計算アプリ：' + label + '決済で計算' + (bank ? '（' + bank + '）' : '') : '';
            note.style.display = label ? 'block' : 'none';
        }

        // 2026-11 → 2026年11月
        function formatExpenseMonth(month) {
            const m = /^(\d{4})-(\d{2})$/.exec(month || '');
            return m ? Number(m[1]) + '年' + Number(m[2]) + '月' : '';
        }

        // 諸費用計算アプリの「契約作成依頼に戻る」ボタンからの合図
        window.addEventListener('message', function(e) {

            closeExpenseCalc();

        // 計算した瞬間（storage）と、この画面に戻ってきたとき（focus / visibilitychange）に反映
        window.addEventListener('storage', function(e) {

        // ========== 金額の入力（打ちながら 3,500 のようにカンマを入れる） ==========
        function formatComma(n) {
            return Number(n).toLocaleString('ja-JP');
        }

        // 入力欄の数字だけを取り出す（全角も可）。空なら 0
        function rawMoney(id) {
            const digits = document.getElementById(id).value.replace(/[０-９]/g, function(c) {
                return String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
            }).replace(/[^0-9]/g, '');
            return digits ? parseInt(digits, 10) : 0;
        }

        // 万円の欄に円で打ってしまった数字を万円に直す
        // （売買代金は10万以上、手付金・諸費用ローン額は1万以上なら円とみなす）
        const YEN_THRESHOLD = { price: 100000, depositAmount: 10000, expenseLoanAmount: 10000 };

        function moneyValue(id) {
            const n = rawMoney(id);
            const limit = YEN_THRESHOLD[id];
            return limit && n >= limit ? Math.round(n / 10000) : n;
        }

        function formatMoneyInput(el) {
            const n = rawMoney(el.id);
            el.value = el.value.trim() === '' || (!n && !/[0０]/.test(el.value)) ? '' : formatComma(n);
        }

        // ========== ローン金額の自動計算（売買代金 − 手付金 ＋ 諸費用ローン額、すべて万円） ==========
        function updateLoanAmount() {
            const loan = document.getElementById('loanAmount');
            const price = moneyValue('price');
            if (!price) {
                loan.value = '';
                return;
            }
            const deposit = document.getElementById('deposit').value === '有り' ? moneyValue('depositAmount') : 0;
            const expense = document.getElementById('expenseLoan').value === '有' ? moneyValue('expenseLoanAmount') : 0;
            const total = price - deposit + expense;
            loan.value = total > 0 ? formatComma(total) + '万' : '';
        }

        Array.prototype.forEach.call(document.querySelectorAll('.js-money'), function(el) {
            el.addEventListener('input', function() {
                formatMoneyInput(el);
                updateLoanAmount();
            });
            // 欄を離れたら、円で打った数字を万円に直して表示し直す
            el.addEventListener('change', function() {
                if (YEN_THRESHOLD[el.id] && rawMoney(el.id) >= YEN_THRESHOLD[el.id]) {
                    el.value = formatComma(moneyValue(el.id));
                    updateLoanAmount();
                }
            });
        });

        function showFieldError(elementId, message) {

            }

            try {

                el.focus();
            }
            return false;
        }

        function clearFieldErrors() {

                group.classList.remove('field-error');

        function clearErrorOnEdit(e) {

        // ========== 担当・同行を記憶 ==========
        function rememberSelection(elementId, storageKey) {
            document.getElementById(elementId).addEventListener('change', function() {
                try {
                    localStorage.setItem(storageKey, this.value);
                } catch (err) {
                    console.error('選択の保存エラー:', err);

            });
        }

        function restoreSelection(elementId, storageKey) {
            try {
                const value = localStorage.getItem(storageKey);
                if (!value) return;
                const select = document.getElementById(elementId);
                select.value = value;
                if (select.value !== value) select.value = '';

        // 手入力欄の内容をリストへ追加し、その項目を選択状態にする
        function saveCustomEntryIfRequested(listType, selectId, inputId, groupId, checkboxId) {
            const select = document.getElementById(selectId);

        // ========== 書式の整え ==========
        // 末尾に敬称を付ける（すでに付いていればそのまま）
        function withSuffix(value, suffix) {
            if (!value) return '';
            const trimmed = value.replace(/[\s　]+$/, '');
            const bare = suffix.replace(/^[\s　]+/, '');
            return trimmed.endsWith(bare) ? trimmed : trimmed + suffix;
        }

        // 桃井主任 → 桃井（担当は役職なしで出す）
        function withoutTitle(name) {
            return name.replace(/(社長|専務|常務|部長|次長|課長|係長|主任|社員)$/, '') || name;
        }

        // 2026-09-30 + 19:00 → 2026/9/30 19:00〜
        function formatContractDate(date, time) {
            if (!date) return '';
            const p = date.split('-');
            let text = Number(p[0]) + '/' + Number(p[1]) + '/' + Number(p[2]);
            if (time) text += ' ' + time + '〜';
            return text;
        }

        // 2026-10-10 + 18:00 → 2026/10/10 18:00
        function formatGmoDate(date, time) {
            if (!date) return '';
            const p = date.split('-');
            return Number(p[0]) + '/' + Number(p[1]) + '/' + Number(p[2]) + (time ? ' ' + time : '');
        }

        // 数字だけなら単位を付ける
        function withUnit(value, unit) {
            if (!value) return '';
            const half = value.replace(/[０-９．，]/g, function(c) {
                return String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
            });
            return /^[\d.,]+$/.test(half) ? half + unit : value;
        }

        // ========== 本文の生成（成功=true／未入力=false） ==========
        function generateReport() {
            clearFieldErrors();

            const val = function(id) { return document.getElementById(id).value.trim(); };

            const customerName = val('customerName');
            const propertyName = val('propertyName');
            const customProperty = val('customProperty');
            const bank = val('bank');
            const customBank = val('customBank');
            const contractDate = val('contractDate');
            const personInCharge = val('personInCharge');

            // 必須チェック（同行・備考以外はすべて必須。画面の上から順に見る）
            const required = [
                ['customerName', 'お客様名を入力してください'],
                ['customerKana', 'フリガナを入力してください'],
                ['address', '住所を入力してください'],
                ['email', 'メールアドレスを入力してください'],
                ['propertyName', '物件名を選んでください'],
                ['customProperty', '物件名を入力してください', function() { return propertyName === 'その他'; }],
                ['roomNumber', '号室を入力してください'],
                ['bank', '金融機関を選んでください'],
                ['customBank', '金融機関名を入力してください', function() { return bank === 'その他'; }],
                ['rate', '金利を入力してください'],
                ['years', '借入年数を選んでください'],
                ['price', '売買代金を入力してください'],
                ['depositAmount', '手付金の金額を入力してください', function() { return val('deposit') === '有り'; }],
                ['expenseLoanAmount', '諸費用ローン額を入力してください', function() { return val('expenseLoan') === '有'; }],
                ['rent', '保証賃料を入力してください'],
                ['contractDate', '契約日を選んでください'],
                ['contractTime', '契約時間を選んでください'],
                ['place', '契約場所を選んでください'],
                ['personInCharge', '担当を選んでください']
            ];
            for (let i = 0; i < required.length; i++) {
                const item = required[i];
                if (item[2] && !item[2]()) continue;
                if (!val(item[0])) return showFieldError(item[0], item[1]);
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val('email'))) {
                return showFieldError('email', 'メールアドレスの形が正しくありません');
            }

            const deposit = val('deposit');
            const depositAmount = val('depositAmount') ? formatComma(moneyValue('depositAmount')) + '万' : '';
            const withMan = function(id) { return val(id) ? formatComma(moneyValue(id)) + '万' : ''; };
            const place = val('place');
            const expenseLoan = val('expenseLoan');
            const expenseMonth = formatExpenseMonth(val('expenseMonth'));

            const items = [
                ['お客様名', withSuffix(customerName, '　様')],
                ['名前（フリガナ）', withSuffix(val('customerKana'), '　サマ')],
                ['住所', val('address')],
                ['お客様メールアドレス', val('email')],
                ['物件名', propertyName === 'その他' ? customProperty : propertyName],
                ['号室', val('roomNumber')],
                ['金融機関', bank === 'その他' ? customBank : bank],
                ['金利', withUnit(val('rate'), '%')],
                ['借入年数', val('years')],
                ['ローン金額（満額の場合は満額と記載）', (updateLoanAmount(), val('loanAmount'))],
                ['売買代金', withMan('price')],
                ['手付金（有・無　※有りの場合金額も記載）', deposit === '有り' && depositAmount ? '有り　' + depositAmount : deposit],
                ['諸費用ローン（有・無）', expenseLoan],
                ['諸費用ローン額', expenseLoan === '有' ? withMan('expenseLoanAmount') + (expenseMonth ? '（' + expenseMonth + '決済で計算）' : '') : ''],
                ['保証賃料', val('rent') ? val('rent') + '円' : ''],
                ['契約日（西暦）、時間', formatContractDate(contractDate, val('contractTime'))],
                ['GMO送信時間', formatGmoDate(val('gmoDate'), val('gmoTime'))],
                ['契約場所', place],
                ['担当', withoutTitle(personInCharge)],
                ['同行（2人の場合は2人記載）', collectAccompany().join('\n')],
                ['立会宅建士（有・無）', val('takken')],
                ['備考', val('remarks')]
            ];

            // 項目の間に空行は入れない（値が空の項目は見出しだけ）
            const lines = ['契約作成依頼'];
            items.forEach(function(item) {
                lines.push('【' + item[0] + '】');
                if (item[1]) lines.push(item[1]);
            });
            reportText = lines.join('\n');
            document.getElementById('previewBox').textContent = reportText;
            document.getElementById('previewSection').classList.add('active');
            document.getElementById('previewSection').scrollIntoView({ behavior: 'smooth' });

            // 手入力した内容を、チェックが入っていればリストへ保存
            saveCustomEntryIfRequested('property', 'propertyName', 'customProperty', 'customPropertyGroup', 'savePropertyToList');
            saveCustomEntryIfRequested('bank', 'bank', 'customBank', 'customBankGroup', 'saveBankToList');

            return true;
        }

        // Slackに貼る依頼文（コピー・Slack投稿で使う）
        let reportText = '';

        // ========== コピー ==========
        // クリップボードへコピー（トースト表示なし）
        function copyToClipboard(text) {
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.top = '0';
                ta.style.left = '0';
                ta.style.width = '2em';
                ta.style.height = '2em';
                ta.style.padding = '0';
                ta.style.border = 'none';
                ta.style.outline = 'none';
                ta.style.boxShadow = 'none';
                ta.style.background = 'transparent';
                ta.style.fontSize = '16px';   // iPhoneで選択時に画面が拡大されないように
                ta.contentEditable = 'true';
                ta.readOnly = false;
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                // iPhone Safari は select() だけでは選択されないので範囲も指定する
                const range = document.createRange();
                range.selectNodeContents(ta);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
                ta.setSelectionRange(0, text.length);
                let ok = document.execCommand('copy');
                document.body.removeChild(ta);
                sel.removeAllRanges();
                // 新しい方法でも書き込んでおく（押した直後なのでiPhoneでも使える）
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(text).catch(function() {});
                    ok = true;
                }
                return ok;
            } catch (err) {
                console.error('コピーエラー:', err);
                if (navigator.clipboard) navigator.clipboard.writeText(text);
                return false;
            }
        }

        document.getElementById('btnCopy').addEventListener('click', function() {
            const text = reportText;
            if (!text || text.trim() === '') {
                showToast('先に「Slack投稿」を押してください', 'error');
                return;
            }
            if (copyToClipboard(text)) {
                showToast('コピーしました！', 'success');
            } else {
                showToast('コピーに失敗しました。プレビューを長押ししてコピーしてください。', 'error');
            }
        });

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.background = type === 'error' ? '#ef4444' : '#10b981';
            toast.classList.add('active');
            setTimeout(function() {
                toast.classList.remove('active');
            }, 3000);
        }

        // アプリ用のURLを開き、アプリが立ち上がらなければ指定のURLへ切り替える
        function openAppThenFallback(appUrl, fallbackUrl) {
            let left = false;
            const onHide = function() { if (document.hidden) left = true; };
            document.addEventListener('visibilitychange', onHide);
            window.addEventListener('pagehide', function() { left = true; });

            window.location.href = appUrl;

            setTimeout(function() {
                document.removeEventListener('visibilitychange', onHide);
                if (!left && !document.hidden) {
                    window.location.href = fallbackUrl;
                }
            }, 1500);
        }

        // Slack投稿ボタン（生成 → コピー → Slackのチャンネルを開く を一括）
        document.getElementById('btnSlack').addEventListener('click', function() {
            if (!generateReport()) {
                return;
            }

            const copied = copyToClipboard(reportText);

            const webUrl = slackWebUrl();

            // 他のページに埋め込まれて開いているときは、ページ自体を移動させると
            // 読み込みエラーになるので、プレビュー横の「Slackを開く」を押してもらう
            if (isEmbedded()) {
                showToast(copied ? 'コピー完了。「Slackを開く」を押してください' : '生成完了。コピーしてから「Slackを開く」を押してください', copied ? 'success' : 'error');
                return;
            }

            // コピーできたときは何も出さずにSlackを開く（失敗したときだけ案内）
            if (!copied) showToast('コピーできませんでした。プレビューをコピーしてSlackに貼り付けてください', 'error');
            if (currentThread) {
                // 申込投稿のスレッドを開く
                window.location.href = threadAppUrl();
            } else if (isAndroidDevice()) {
                // Androidは intent:// で開く（アプリが無ければWeb版へ）
                window.location.href = slackAppUrl();
            } else {
                openAppThenFallback(slackAppUrl(), webUrl);
            }
        });

        // Slackに直接投稿（GAS経由）
        let lastPosted = '';
        document.getElementById('btnDirect').addEventListener('click', async function() {
            if (!generateReport()) return;
            if (!settings.gasUrl) {
                showToast('先に「⚙ 変更」で投稿用URLを設定してください', 'error');
                return;
            }
            if (reportText === lastPosted && !this.dataset.again) {
                this.dataset.again = '1';
                showToast('同じ内容を投稿済みです。もう一度押すと再投稿します', 'error');
                return;
            }
            if (threadSearching) {
                showToast('申込スレッドを探しています。少し待ってからもう一度押してください', 'error');
                return;
            }
            if (!currentThread) {
                const ok = confirm('申込のスレッドが見つかりません。\nチャンネルに新しく投稿しますか？');
                if (!ok) return;
            }
            const btn = this;
            const label = btn.textContent;
            btn.disabled = true;
            btn.textContent = '投稿中…';
            try {
                const res = await fetch(settings.gasUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ channel: settings.channel, text: reportText, thread_ts: currentThread ? currentThread.ts : '' })
                });
                const j = await res.json();
                if (j.ok) {
                    lastPosted = reportText;
                    delete btn.dataset.again;
                    showToast(currentThread ? '申込スレッドに投稿しました' : 'チャンネルに投稿しました', 'success');
                } else {
                    showToast('投稿に失敗しました（' + (j.error || '不明') + '）', 'error');
                }
            } catch (err) {
                copyToClipboard(reportText);
                showToast('通信に失敗しました。コピー済みなので、Slackに貼り付けてください', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = label;
            }
        });

        // ページ読み込み時の初期化
        wakeThreadApi();
        renderChannelView();
        renderPropertySelect();
        renderBankSelect();
        renderStaffSelects();
        renderYears();
        renderContractDates('contractDate');
        renderContractTimes('contractTime', '19:00');
        renderContractDates('gmoDate');
        renderContractTimes('gmoTime');
        restoreSelection('personInCharge', 'lastPersonInCharge');
        restoreSelection('accompany', 'lastAccompany');
        rememberSelection('personInCharge', 'lastPersonInCharge');
        rememberSelection('accompany', 'lastAccompany');

        // 物件・号室・お客様名が変わったら申込スレッドを探し直す
        ['propertyName'].forEach(function(id) {
            document.getElementById(id).addEventListener('change', scheduleLookupThread);
        });
        ['customProperty', 'roomNumber', 'customerName'].forEach(function(id) {
            document.getElementById(id).addEventListener('input', scheduleLookupThread);
        });
    </script>
<!-- ホーム画面へのインストール
     Androidの Chrome は、同じサイト（iety0214-hub.github.io）のアプリが1つでも入っていると
     メニューの「ホーム画面に追加」で「すでにインストールされています」と出て入れられない。
     ページから直接インストールの画面を出せば、アプリごとに入れられる。
     iPhone / iPad はSafariの「ホーム画面に追加」を案内する。 -->
<div id="pwaInstallBar" style="display:none;position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top, 0px));z-index:3000;background:#1e2a4a;color:#fff;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.28);padding:6px 6px 6px 16px;font-size:14px;font-weight:700;align-items:center;gap:8px;white-space:nowrap;max-width:calc(100vw - 24px);">
  <span>📲 アプリとして追加</span>
  <button type="button" id="pwaInstallBtn" style="border:none;border-radius:999px;background:#fff;color:#1e2a4a;font-size:14px;font-weight:700;padding:8px 16px;cursor:pointer;">追加</button>
  <button type="button" id="pwaInstallClose" aria-label="閉じる" style="border:none;background:transparent;color:#fff;font-size:16px;padding:6px 10px;cursor:pointer;">✕</button>
</div>
<script>
(function () {
  var deferred = null;
  var bar = document.getElementById('pwaInstallBar');
  function hide() { bar.style.display = 'none'; }
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferred = e;
    // PCでは出さない（スマホ・タブレットだけ）
    if (!/Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent)) return;
    try { if (sessionStorage.getItem('pwaInstallClosed')) return; } catch (err) {}
    bar.style.display = 'flex';
  });
  document.getElementById('pwaInstallBtn').addEventListener('click', function () {
    if (!deferred) return;
    hide();
    deferred.prompt();
    deferred.userChoice.then(function () { deferred = null; }, function () { deferred = null; });
  });
  document.getElementById('pwaInstallClose').addEventListener('click', function () {
    hide();
    try { sessionStorage.setItem('pwaInstallClosed', '1'); } catch (err) {}
  });
  window.addEventListener('appinstalled', function () { hide(); deferred = null; });

  // iPhone / iPad はページからインストール画面を出せないので、Safariでの追加方法を案内する
  var ua = navigator.userAgent;
  var isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var standalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
  if (isIOS && !standalone) {
    var key = 'iosA2hsClosed:' + location.pathname;
    var closed = false;
    try { closed = !!localStorage.getItem(key); } catch (err) {}
    if (!closed) {
      var ios = document.createElement('div');
      ios.id = 'pwaIosBar';
      ios.style.cssText = 'position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top, 0px));z-index:3000;background:#1e2a4a;color:#fff;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.28);padding:10px 8px 10px 14px;font-size:13px;font-weight:600;line-height:1.5;display:flex;align-items:center;gap:8px;';
      var isSafari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|Line\//.test(ua);
      ios.innerHTML = '<span style="flex:1;">📲 アプリとして追加するには<br>' +
        (isSafari ? '共有ボタン（□↑）、または右下の「…」→「共有」→「ホーム画面に追加」（「Webアプリとして開く」はオンのまま）' : 'Safariでこのページを開き、共有ボタン（□↑）、または右下の「…」→「共有」→「ホーム画面に追加」') +
        '</span><button type="button" aria-label="閉じる" style="border:none;background:transparent;color:#fff;font-size:16px;padding:6px 10px;cursor:pointer;">✕</button>';
      ios.querySelector('button').addEventListener('click', function () {
        ios.remove();
        try { localStorage.setItem(key, '1'); } catch (err) {}
      });
      document.body.appendChild(ios);
    }
  }
})();
</script>
<script>
// ===== インストールの診断（URLの末尾に #pwa を付けて開いたときだけ表示） =====
(function () {
  if (location.hash !== '#pwa') return;
  var box = document.createElement('pre');
  box.style.cssText = 'position:fixed;left:8px;right:8px;bottom:90px;z-index:4000;background:#111;color:#0f0;font:12px/1.5 monospace;padding:10px;border-radius:8px;white-space:pre-wrap;max-height:45vh;overflow:auto;';
  document.body.appendChild(box);
  var t0 = Date.now();
  var info = {
    'Chrome': (navigator.userAgent.match(/Chrome\/[\d.]+/) || ['?'])[0],
    'Android': (navigator.userAgent.match(/Android [\d.]+/) || ['-'])[0],
    'アプリとして起動中': window.matchMedia('(display-mode: standalone)').matches ? 'はい' : 'いいえ',
    'manifest': (document.querySelector('link[rel=manifest]') || {}).href || 'なし',
    'インストール可能の合図': 'まだ来ていない（10秒待ちます）',
    '選択結果': '-'
  };
  function render() {
    box.textContent = '【インストール診断】\n' + Object.keys(info).map(function (k) { return k + '：' + info[k]; }).join('\n');
  }
  window.addEventListener('beforeinstallprompt', function (e) {
    info['インストール可能の合図'] = '来た（' + ((Date.now() - t0) / 1000).toFixed(1) + '秒後）';
    render();
    if (e.userChoice) e.userChoice.then(function (r) { info['選択結果'] = r.outcome; render(); });
  });
  window.addEventListener('appinstalled', function () { info['選択結果'] = 'インストール完了'; render(); });
  fetch(document.querySelector('link[rel=manifest]').href, { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (m) {
    info['manifest id'] = m.id; info['scope'] = m.scope; info['icons'] = (m.icons || []).map(function (i) { return i.sizes; }).join(',');
    render();
  }).catch(function (err) { info['manifest読込'] = '失敗 ' + err; render(); });
  if (navigator.getInstalledRelatedApps) {
    navigator.getInstalledRelatedApps().then(function (a) { info['関連アプリ'] = a.length; render(); }).catch(function () {});
  }
  setTimeout(function () {
    if (/まだ/.test(info['インストール可能の合図'])) { info['インストール可能の合図'] = '10秒待っても来なかった'; render(); }
  }, 10000);
  render();
})();
</script>
